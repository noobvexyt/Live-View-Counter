<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Live View Counter</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/site.css">
</head>
<body data-page="notfound">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-head">
    <div class="wrap head-row">
      <a class="brand" href="/"><img src="/favicon.svg" alt="" width="28" height="28">Live View Counter</a>
      <nav class="head-nav" aria-label="Main">
        <a href="/signin" data-when-guest>Sign in</a>
        <a href="/account" data-when-user hidden>Account</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="wrap narrow center">
      <p class="big-404" aria-hidden="true">404</p>
      <h1>There’s no page here</h1>
      <p class="lede">The address may be mistyped, or the page may have moved.</p>
      <div class="btn-row centered">
        <a class="btn" href="/">Go to the home page</a>
      </div>
    </div>
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <nav aria-label="Site">
        <a href="/">Home</a>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
        <a href="/cookies">Cookies</a>
        <a href="/contact">Contact and reports</a>
      </nav>
    </div>
  </footer>

  <script src="/site.js"></script>
</body>
</html>
